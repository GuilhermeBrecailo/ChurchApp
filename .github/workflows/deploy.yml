name: Deploy CrunchApp

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Atualizar servidor
        run: |
          set -e

          run_docker() {
            if docker info >/dev/null 2>&1; then
              docker "$@"
            elif command -v sudo >/dev/null 2>&1 && sudo -n docker info >/dev/null 2>&1; then
              sudo docker "$@"
            else
              echo "Runner $(id -un) cannot access Docker at /var/run/docker.sock." >&2
              id >&2
              ls -l /var/run/docker.sock >&2 || true
              echo "Configure Docker access for the runner, then rerun this workflow." >&2
              exit 1
            fi
          }
          project_dir=""
          for candidate in \
            /home/ghrunner/CrunchApp \
            /home/ghrunner/ChurchApp \
            /opt/CrunchApp \
            /opt/ChurchApp \
            /srv/CrunchApp \
            /srv/ChurchApp; do
            if [ -f "$candidate/docker-compose.yml" ]; then
              project_dir="$candidate"
              break
            fi
          done

          if [ -n "$project_dir" ]; then
            git -C "$project_dir" pull origin main
            run_docker compose --project-directory "$project_dir" up -d --build web api
            exit 0
          fi

          run_docker run --rm \
            -v /root/CrunchApp:/root/CrunchApp \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -w /root/CrunchApp \
            docker:27-cli \
            sh -euxc '
              apk add --no-cache git docker-cli-compose
              git pull origin main
              docker compose up -d --build web api
            '
