name: Deploy CrunchApp

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Atualizar servidor
        run: |
          set -e
          project_dir=""
          for candidate in \
            /home/ghrunner/CrunchApp \
            /home/ghrunner/ChurchApp \
            /opt/CrunchApp \
            /opt/ChurchApp \
            /srv/CrunchApp \
            /srv/ChurchApp; do
            if [ -f "$candidate/docker-compose.yml" ]; then
              project_dir="$candidate"
              break
            fi
          done

          if [ -n "$project_dir" ]; then
            git -C "$project_dir" pull origin main
            docker compose --project-directory "$project_dir" up -d --build web api
            exit 0
          fi

          docker run --rm \
            -v /root/CrunchApp:/root/CrunchApp \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -w /root/CrunchApp \
            docker:27-cli \
            sh -euxc '
              apk add --no-cache git docker-cli-compose
              git pull origin main
              docker compose up -d --build web api
            '
