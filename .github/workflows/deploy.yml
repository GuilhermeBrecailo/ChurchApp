name: Deploy CrunchApp

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Atualizar servidor
        run: |
          set -e
          sudo -n git -C /root/CrunchApp pull origin main
          sudo -n docker compose --project-directory /root/CrunchApp up -d --build web api
