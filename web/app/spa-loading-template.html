<!-- Mostrado dentro de #__nuxt nas rotas ssr:false enquanto o JS carrega.
     O Nuxt remove este bloco quando o app monta. Estilos inline de proposito:
     nao dependem de nenhum arquivo externo. -->
<div class="cp-boot" role="status" aria-live="polite" aria-label="Carregando ChurchApp">
  <div class="cp-boot__spinner" aria-hidden="true"></div>
  <span class="cp-boot__label">ChurchApp</span>
</div>
<style>
  .cp-boot {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: #f6f7f9;
    color: #b5472a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .cp-boot__spinner {
    width: 28px;
    height: 28px;
    border: 3px solid currentColor;
    border-right-color: transparent;
    border-radius: 50%;
    animation: cp-boot-spin 0.8s linear infinite;
  }
  @keyframes cp-boot-spin {
    to { transform: rotate(360deg); }
  }
  @media (prefers-color-scheme: dark) {
    .cp-boot { background: #0d1117; color: #f0975a; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cp-boot__spinner { animation-duration: 2.4s; }
  }
</style>
